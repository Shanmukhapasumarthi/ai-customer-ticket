services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-support-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-support-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend